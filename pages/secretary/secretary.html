<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Secretaria</title>
    <link rel="icon" href="/assets/logo-brightfuture.png">
    <link rel="stylesheet" href="./secretary.css">
</head>

<body>
    <header class="top">
        <button class="backBtn">Sair</button>
        <img class="logo" src="/assets/logoname-brightfuture.png" alt="bf logo">
    </header>
    <main class="container">
        <form class="formulario" action="formMatricula">

            <section class="etapa matricula">

                <h2>Matrícula</h2>
                <!--escolher opção-->
                <button id="newMatricula">Nova Matrícula</button>
                
                <button id="editMatricula">Editar Matrícula</button>

            </section>

            <section class="etapa ativa">
                <!-- input dados dos alunos -->
                <h2>Dados dos alunos</h2>
                <label>Nome: </label>
                <input type="text" id="nome" placeholder="João da Silva Cunha" required>

                <label>CPF:</label>
                <input type="text" id="cpf" placeholder="000.000.000-00" required>

                <label>Data de Nascimento:</label>
                <input type="date" id="data-nascimento" placeholder="07/12/2026" required>

                <label for="serie">Série</label>
                <select id="serie" required>
                    <option value="">Selecione</option>
                    <option>Educação Infantil</option>
                    <option>1º Ano</option>
                    <option>2º Ano</option>
                    <option>3º Ano</option>
                    <option>4º Ano</option>
                    <option>5º Ano</option>
                    <option>6º Ano</option>
                    <option>7º Ano</option>
                    <option>8º Ano</option>
                    <option>9º Ano</option>
                    <option>1ª Série</option>
                    <option>2ª Série</option>
                    <option>3ª Série</option>
                </select>

                <label for="turma">Turma</label>
                <select id="turma">
                    <option value="">Selecione</option>
                    <option>A</option>
                    <option>B</option>
                </select>

                <button type="button" onclick="proximaEtapa()">Próximo</button>
            </section>

            <section class="etapa">
                <!-- input dados responsavel-->
                <h2>Dados dos resposáveis </h2>
                <label>Nome:</label>
                <input type="text" id="responsavel" required placeholder="Marta da Silva ">

                <label>Telefone:</label>
                <input type="tel" id="telefone" required placeholder="(79) 9 9999-9999">

                <button type="button" onclick="voltarEtapa()">Voltar</button>
                <button type="button" onclick="proximaEtapa()">Próximo</button>
            </section>

            <section class="etapa validacao">
                <!--validação dos dados-->
                <h2>Confirme os Dados</h2>

                <h3>Dados do aluno</h3>
                <hr>

                <label>Nome do aluno:</label>
                <p>-> <span id="outNome"></span></p>
                <hr>

                <label>CPF do aluno:</label>
                <p>-> <span id="outCpf"></span></p>
                <hr>

                <label>Data de Nascimento do aluno:</label>
                <p>-> <span id="outData"></span></p>
                <hr>

                <h3>Dados do resposável</h3>
                <hr>
                <label>Nome do responsável:</label>
                <p>-> <span id="outNomeResp"></span></p>
                <hr>

                <label>Telefone do responsável:</label>
                <p>-> <span id="outTelefoneResp"></span></p>
                <hr>
                
                <button type="button" onclick="voltarEtapa()">Voltar</button>
                <button type="button">Concluir Matrícula</button>

            </section>

            <section class="etapa conclusao">
                <!--conclusão da matricula-->
                <h2>Matrícula concluída!</h2>

                <label>Boas vindas, <span id="outNome"></span>!</label>

            </section>

            <section class="etapa editMatricula">
                <!--pesquisar matricula-->
                <input type="search">

                <div class="modMatricula">
                    <!--modificação da matricula-->
                    <h2>Dados dos alunos</h2>

                    <label>Nome: </label>
                    <input type="text" id="nome" placeholder="João da Silva Cunha" required>

                    <label>CPF:</label>
                    <input type="text" id="cpf" placeholder="000.000.000-00" required>

                    <label>Data de Nascimento:</label>
                    <input type="date" id="data-nascimento" placeholder="07/12/2010" required>

                    <label for="serie">Série</label>
                    <select id="serie" required>
                        <option value="">Selecione</option>
                        <option>Educação Infantil</option>
                        <option>1º Ano</option>
                        <option>2º Ano</option>
                        <option>3º Ano</option>
                        <option>4º Ano</option>
                        <option>5º Ano</option>
                        <option>6º Ano</option>
                        <option>7º Ano</option>
                        <option>8º Ano</option>
                        <option>9º Ano</option>
                        <option>1ª Série</option>
                        <option>2ª Série</option>
                        <option>3ª Série</option>
                    </select>

                    <label for="turma">Turma</label>
                    <select id="turma" required>
                        <option value="">Selecione</option>
                        <option>A</option>
                        <option>B</option>
                    </select>

                    <h2>Dados dos resposáveis </h2>
                    
                    <label>Nome:</label>
                    <input type="text" id="responsavel" placeholder="Marta da Silva">

                    <label>Telefone:</label>
                    <input type="tel" id="telefone" placeholder="(79) 9 9999-9999">

                    <button type="button">Cancelar</button>
                    <button type="button">Salvar</button>

                </div>

            </section>

        </form>
    </main>
    <script src="./secretary.js"></script>
</body>

</html>
