<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Secretaria</title>
    <link rel="icon" href="/assets/unitico.png">
    <link rel="stylesheet" href="./secretary.css">
</head>

<body>
    <header class="top">
        <button class="backBtn">Sair</button>
        <img class="logo" src="/assets/unitlogo.png" alt="Unit logo">
    </header>
    <main class="container">
        <form action="formMatricula">
            <section class="etapa ativa">
                <!-- input dados dos alunos -->
                <h2>Dados dos alunos</h2>
                <label>Nome: </label>
                <input type="text" id="nome" required placeholder="João da Silva Cunha">

                <label>CPF:</label>
                <input type="text" id="cpf" required placeholder="000.000.000-00">

                <label>Data de Nascimento:</label>
                <input type="date" id="data-nascimento" required placeholder="07/12/2026">
                <button type="button" onclick="proximaEtapa()">Próximo</button>
            </section>

            <section class="etapa">
                <h2>Dados dos resposáveis </h2>
                <!-- input dados responsavel-->
                <label>Nome:</label>
                <input type="text" id="responsavel" required placeholder="Marta da Silva ">

                <label>Telefone:</label>
                <input type="tel" id="telefone" required placeholder="(79) 9999-9999">

                <button type="button" onclick="voltarEtapa()">Voltar</button>
                <button type="button" onclick="proximaEtapa()">Próximo</button>
            </section>

            <section class="etapa validacao">
                <h2>Confirme os Dados</h2>

                <h3>Dados do aluno</h3>
                <p>Nome do aluno: <span id="outNome"></span></p>
                <p>CPF do aluno: <span id="outCpf"></span></p>
                <p>Data de Nascimento do aluno: <span id="outData"></span></p>

                <h3>Dados do resposável</h3>
                <p>Nome do responsável <span id="outNomeResp"></span></p>
                <p>Telefone do responsável <span id="outTelefoneResp"></span></p>
                
                <button type="button" onclick="voltarEtapa()">Voltar</button>
            </section>
        </form>
    </main>
    <script src="./secretary.js"></script>
</body>

</html>
