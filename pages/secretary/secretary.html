<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reserva de Matrícula</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <main class="container">

        <form class="formulario">

            <h1>Matrícula</h1>

            <!-- DADOS DO ALUNO -->
            <section>
                <h2>DADOS DO ALUNO</h2>

                <div class="campo">
                    <label for="nome">Nome *</label>
                    <input type="text" id="nome" required>
                </div>

                <div class="campo">
                    <label for="cpf">CPF *</label>
                    <input type="text" id="cpf"
                           placeholder="000.000.000-00" required>
                </div>
                
                <div class="campo">
                    <label for="nascimento">Data de Nascimento *</label>
                    <input type="date" id="nascimento" required>
                </div>

                <div class="campo">
                    <label for="telefone">Telefone *</label>
                    <input type="tel" id="telefone" placeholder="(00) 00000-0000">
                </div>

                <div class="campo">
                    <label for="email">E-mail *</label>
                    <input type="email" id="email" required>
                </div>

                <div class="campo">
                    <label for="turma">Turma de 2027 *</label>

                    <select id="turma" required>
                        <option value="">Selecione</option>
                        <option>A</option>
                        <option>B</option>
                        <option>C</option>
                    </select>
                </div>
            </section>

            <!-- DADOS DOS RESPONSÁVEIS -->
            <section>
                <h2>DADOS DOS RESPONSÁVEL</h2>

                <h3>Responsável 1</h3>
                <div class="campo">
                    <label for="responsavel">Nome do Responsável</label>
                    <input type="text" id="responsavel">
                </div>

                <div class="campo">
                    <label for="cpfResponsavel">CPF do Responsável</label>
                    <input type="text" id="cpfResponsavel"
                           placeholder="000.000.000-00">
                </div>

                <div class="campo">
                    <label for="telefoneResponsavel">Telefone do Responsável</label>
                    <input type="tel" id="telefoneResponsavel"
                           placeholder="(00) 00000-0000">
                </div>

                <div class="campo">
                    <label for="emailResponsavel">E-mail do Responsável</label>
                    <input type="email" id="emailResponsavel">
                </div>
                
                <h3>Responsável 2</h3>
                <div class="campo">
                    <label for="responsavel2">Nome do Responsável</label>
                    <input type="text" id="responsavel2">
                </div>

                <div class="campo">
                    <label for="cpfResponsavel2">CPF do Responsável</label>
                    <input type="text" id="cpfResponsavel2"
                           placeholder="000.000.000-00">
                </div>

                <div class="campo">
                    <label for="telefoneResponsavel2">Telefone do Responsável</label>
                    <input type="tel" id="telefoneResponsavel2"
                           placeholder="(00) 00000-0000">
                </div>

                <div class="campo">
                    <label for="emailResponsavel2">E-mail do Responsável</label>
                    <input type="email" id="emailResponsavel2">
                </div>
            </section>

            <button class="sendBtn" type="submit">ENVIAR</button>

        </form>

    </main>

</body>
</html>

    </main>
    <script src="./secretary.js"></script>
</body>
</html>
